name: Phoenix Firmware Dumper & Release

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware file'
        required: true
        default: 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip'
      device_codename:
        description: 'Device codename (e.g., X659B)'
        required: true
        default: 'X659B'
      brand:
        description: 'Device brand'
        required: true
        default: 'Infinix'
      firmware_version:
        description: 'Firmware version/tag'
        required: true
        default: 'Hot-10i-04'

env:
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url || 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip' }}
  DEVICE_CODENAME: ${{ github.event.inputs.device_codename || 'X659B' }}
  BRAND: ${{ github.event.inputs.brand || 'Infinix' }}
  FIRMWARE_VERSION: ${{ github.event.inputs.firmware_version || 'Hot-10i-04' }}

jobs:
  dump-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3 python3-pip aria2 unzip p7zip-full \
            liblz4-tool brotli android-sdk-libsparse-utils \
            git curl wget file zstd e2fsprogs
          
          # Install partition tools for super.img extraction
          pip3 install --user protobuf==3.20.3 bsdiff4 six docopt pycryptodome zstandard lz4 brotli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Download lpunpack and other partition tools from Android SDK
          mkdir -p ~/bin
          cd ~/bin
          
          # Get lpunpack from Android CI/prebuilts
          wget -q https://github.com/northumber/android-partition-tools_prebuilt_binaries/releases/download/v1.0/lpunpack-arm64-v8a -O lpunpack || \
          wget -q https://raw.githubusercontent.com/HemanthJabalpuri/AndroidExplorer/master/lpunpack.py -O lpunpack.py
          
          # Alternative: use simg2img and img2simg from android-sdk-libsparse-utils
          which simg2img || echo "simg2img not found"
          chmod +x * 2>/dev/null || true
      
      - name: Clone Phoenix
        run: |
          git clone --depth=1 https://github.com/DroidDumps/phoenix_firmware_dumper.git phoenix
          cd phoenix && chmod +x dumper.sh setup.sh
          bash setup.sh || true
      
      - name: Download firmware with aria2
        run: |
          mkdir -p firmware && cd firmware
          echo "Downloading with aria2..."
          aria2c -x16 -s16 -c -o firmware.zip '${{ env.FIRMWARE_URL }}'
          
          # Verify
          ls -lh firmware.zip
          file firmware.zip
          
          # Check if it's HTML instead of ZIP
          if file firmware.zip | grep -q "HTML"; then
            echo "ERROR: Downloaded file is HTML, not ZIP"
            head -c 2000 firmware.zip
            exit 1
          fi
          
          unzip -l firmware.zip | head -30
          echo "firmware_path=$(pwd)/firmware.zip" >> $GITHUB_ENV
      
      - name: Extract firmware and handle super.img
        run: |
          mkdir -p output
          cd output
          
          # Extract firmware
          unzip -q '${{ env.firmware_path }}'
          
          echo "Extracted contents:"
          ls -lah
          
          # Find super.img
          SUPER_IMG=$(find . -name "super.img" -type f | head -1)
          
          if [ -n "$SUPER_IMG" ]; then
            echo "Found super.img: $SUPER_IMG"
            
            # Check if sparse and convert
            if file "$SUPER_IMG" | grep -q "sparse"; then
              echo "Converting sparse super.img..."
              simg2img "$SUPER_IMG" super.raw.img
              mv super.raw.img "$SUPER_IMG"
            fi
            
            # Extract logical partitions from super
            echo "Extracting partitions from super.img..."
            mkdir -p super_extracted
            cd super_extracted
            
            # Try lpunpack first
            if command -v lpunpack &> /dev/null; then
              lpunpack "../$SUPER_IMG" || echo "lpunpack failed, trying alternative"
            fi
            
            # Alternative: use imjtool if available
            if [ ! "$(ls -A .)" ] && command -v imjtool &> /dev/null; then
              imjtool "../$SUPER_IMG" extract
            fi
            
            # Check what we got
            echo "Extracted partitions:"
            ls -lah
            
            # Mount and extract build.prop from each partition
            for img in *.img; do
              if [ -f "$img" ] && [ -s "$img" ]; then
                mkdir -p "${img%.img}_mnt"
                # Try to mount as ext4
                sudo mount -o loop "$img" "${img%.img}_mnt" 2>/dev/null && {
                  echo "Mounted $img"
                  find "${img%.img}_mnt" -name "build.prop" -exec cp {} "../${img%.img}_build.prop" \; 2>/dev/null
                  sudo umount "${img%.img}_mnt" 2>/dev/null || true
                }
                rmdir "${img%.img}_mnt" 2>/dev/null || true
              fi
            done
            
            cd ..
          else
            echo "No super.img found"
          fi
          
          # List all extracted files
          echo "All output files:"
          find . -type f -name "*.img" -o -name "*.bin" -o -name "*.prop" | head -50
      
      - name: Run Phoenix dumper on extracted firmware
        id: dump
        run: |
          cd phoenix
          
          # Create a working directory with the extracted firmware
          mkdir -p working
          cp -r ../output/* working/ 2>/dev/null || true
          
          # Run dumper on the directory
          bash dumper.sh working/ 2>&1 | tee dump.log || true
          
          # Find output
          OUTPUT_DIR=$(find out -maxdepth 1 -type d | grep -v "^out$" | head -1)
          [ -z "$OUTPUT_DIR" ] && OUTPUT_DIR="out/tmp"
          
          if [ -d "$OUTPUT_DIR" ]; then
            echo "output_dir=$(realpath $OUTPUT_DIR)" >> $GITHUB_OUTPUT
            echo "total_size=$(du -sh $OUTPUT_DIR | cut -f1)" >> $GITHUB_OUTPUT
            ls -la "$OUTPUT_DIR"
          else
            # Use our manual extraction as fallback
            echo "output_dir=$(realpath ../output)" >> $GITHUB_OUTPUT
            echo "total_size=$(du -sh ../output | cut -f1)" >> $GITHUB_OUTPUT
          fi
      
      - name: Create archive
        id: archive
        run: |
          OUTPUT_DIR="${{ steps.dump.outputs.output_dir }}"
          ARCHIVE="${{ env.BRAND }}_${{ env.DEVICE_CODENAME }}_${{ env.FIRMWARE_VERSION }}_dump.tar.gz"
          
          tar -czf "$ARCHIVE" -C "$(dirname $OUTPUT_DIR)" "$(basename $OUTPUT_DIR)"
          echo "archive_name=$ARCHIVE" >> $GITHUB_OUTPUT
          ls -lh $ARCHIVE
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND }}-${{ env.DEVICE_CODENAME }}-dump
          path: ${{ steps.archive.outputs.archive_name }}
          retention-days: 30
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.BRAND }}-${{ env.DEVICE_CODENAME }}-${{ env.FIRMWARE_VERSION }}-${{ github.run_number }}
          name: "${{ env.BRAND }} ${{ env.DEVICE_CODENAME }} - ${{ env.FIRMWARE_VERSION }}"
          body: |
            **Device:** ${{ env.BRAND }} ${{ env.DEVICE_CODENAME }}
            **Version:** ${{ env.FIRMWARE_VERSION }}
            **Size:** ${{ steps.dump.outputs.total_size }}
            **Source:** ${{ env.FIRMWARE_URL }}
            
            **Note:** Super partition manually extracted with lpunpack/simg2img
          files: ${{ steps.archive.outputs.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
