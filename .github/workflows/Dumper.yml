name: Phoenix Firmware Dumper & Release

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware file'
        required: true
        default: 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip'
      device_codename:
        description: 'Device codename (e.g., X659B)'
        required: true
        default: 'X659B'
      brand:
        description: 'Device brand'
        required: true
        default: 'Infinix'
      firmware_version:
        description: 'Firmware version/tag'
        required: true
        default: 'Hot-10i-04'

env:
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url || 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip' }}
  DEVICE_CODENAME: ${{ github.event.inputs.device_codename || 'X659B' }}
  BRAND: ${{ github.event.inputs.brand || 'Infinix' }}
  FIRMWARE_VERSION: ${{ github.event.inputs.firmware_version || 'Hot-10i-04' }}

jobs:
  dump-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup dependencies
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3 python3-pip python3-setuptools python3-venv \
            git curl wget aria2 \
            unzip p7zip-full p7zip-rar \
            liblz4-tool brotli \
            android-sdk-libsparse-utils \
            libxml2-utils \
            jq bc file \
            cpio gzip bzip2 xz-utils \
            zstd
          
          echo "Installing Python packages from PyPI only..."
          pip3 install --user --upgrade pip
          pip3 install --user \
            protobuf==3.20.3 \
            bsdiff4 \
            six \
            docopt \
            pycryptodome \
            zstandard \
            lz4 \
            brotli
          
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pip3 list --user
      
      - name: Clone Phoenix Firmware Dumper
        run: |
          git clone --depth=1 https://github.com/DroidDumps/phoenix_firmware_dumper.git phoenix
          cd phoenix
          chmod +x dumper.sh setup.sh
      
      - name: Run Phoenix setup
        run: |
          cd phoenix
          # Run setup but ignore pip errors (we already installed deps)
          bash setup.sh || echo "Setup completed with warnings"
      
      - name: Download firmware
        run: |
          mkdir -p firmware
          cd firmware
          echo "Downloading from: ${{ env.FIRMWARE_URL }}"
          
          # Try aria2c first, fallback to wget/curl
          aria2c -x4 -s4 -c -o firmware.zip '${{ env.FIRMWARE_URL }}' 2>/dev/null || \
            wget -q --show-progress -c -O firmware.zip '${{ env.FIRMWARE_URL }}' || \
            curl -L -o firmware.zip '${{ env.FIRMWARE_URL }}'
          
          ls -lh firmware.zip
          echo "firmware_path=$(pwd)/firmware.zip" >> $GITHUB_ENV
      
      - name: Dump firmware with Phoenix
        id: dump
        run: |
          cd phoenix
          echo "Starting dump for ${{ env.BRAND }} ${{ env.DEVICE_CODENAME }}"
          
          # Run dumper
          bash dumper.sh '${{ env.firmware_path }}' 2>&1 | tee dump.log || {
            echo "Dumper exited with code ${PIPESTATUS[0]}"
          }
          
          # Find output directory
          OUTPUT_DIR=$(find out -maxdepth 1 -type d | grep -v "^out$" | sort -r | head -n 1)
          
          if [ -z "$OUTPUT_DIR" ]; then
            OUTPUT_DIR=$(find . -maxdepth 2 -type d -name "*${{ env.DEVICE_CODENAME }}*" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$OUTPUT_DIR" ] || [ ! -d "$OUTPUT_DIR" ]; then
            echo "Error: No output found"
            ls -la out/ 2>/dev/null || true
            exit 1
          fi
          
          echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "total_size=$(du -sh $OUTPUT_DIR | cut -f1)" >> $GITHUB_OUTPUT
          find "$OUTPUT_DIR" -type f | head -20
      
      - name: Create release archive
        id: archive
        run: |
          OUTPUT_DIR="${{ steps.dump.outputs.output_dir }}"
          ARCHIVE_NAME="${{ env.BRAND }}_${{ env.DEVICE_CODENAME }}_${{ env.FIRMWARE_VERSION }}_dump.tar.gz"
          
          echo "Creating $ARCHIVE_NAME from $OUTPUT_DIR"
          tar -czf "$ARCHIVE_NAME" -C "$(dirname "$OUTPUT_DIR")" "$(basename "$OUTPUT_DIR")"
          
          ARCHIVE_BYTES=$(stat -c%s "$ARCHIVE_NAME" 2>/dev/null || echo "0")
          echo "Size: $(du -h $ARCHIVE_NAME | cut -f1) ($ARCHIVE_BYTES bytes)"
          
          # Split if >2GB
          if [ "$ARCHIVE_BYTES" -gt 2147483648 ]; then
            echo "File too large, splitting..."
            split -b 1900M "$ARCHIVE_NAME" "${ARCHIVE_NAME}.part"
          fi
          
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "archive_path=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND }}-${{ env.DEVICE_CODENAME }}-dump
          path: ${{ steps.archive.outputs.archive_path }}*
          retention-days: 30
          compression-level: 0
      
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.BRAND }}-${{ env.DEVICE_CODENAME }}-${{ env.FIRMWARE_VERSION }}-${{ github.run_number }}
          name: "${{ env.BRAND }} ${{ env.DEVICE_CODENAME }} - ${{ env.FIRMWARE_VERSION }}"
          body: |
            ## Firmware Dump Details
            
            | Property | Value |
            |----------|-------|
            | **Brand** | ${{ env.BRAND }} |
            | **Device** | ${{ env.DEVICE_CODENAME }} |
            | **Version** | ${{ env.FIRMWARE_VERSION }} |
            | **Platform** | MT6768 |
            | **Dump Size** | ${{ steps.dump.outputs.total_size }} |
            
            ### Contents
            - Boot images (boot_a, boot_b)
            - DTB/Dtbo images
            - Super partition (system, vendor, product)
            - Preloader, Modem, TEE images
            - VBMeta, Vendor boot
            
            ### Source
            - **URL:** ${{ env.FIRMWARE_URL }}
            - **Tool:** Phoenix Firmware Dumper
            
            - A/B partitions, Dynamic partitions
          files: ${{ steps.archive.outputs.archive_path }}*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
