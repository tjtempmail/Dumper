name: Phoenix Firmware Dumper & Release

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware file'
        required: true
        default: 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip'
      device_codename:
        description: 'Device codename (e.g., X659B)'
        required: true
        default: 'X659B'
      brand:
        description: 'Device brand'
        required: true
        default: 'Infinix'
      firmware_version:
        description: 'Firmware version/tag'
        required: true
        default: 'Hot-10i-04'

env:
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url || 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip' }}
  DEVICE_CODENAME: ${{ github.event.inputs.device_codename || 'X659B' }}
  BRAND: ${{ github.event.inputs.brand || 'Infinix' }}
  FIRMWARE_VERSION: ${{ github.event.inputs.firmware_version || 'Hot-10i-04' }}

jobs:
  dump-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            aria2 unzip p7zip-full \
            simg2img e2fsprogs \
            liblz4-tool brotli \
            git curl file zstd
          
          # Download lpunpack from reliable source
          mkdir -p ~/bin
          cd ~/bin
          wget -q https://github.com/northumber/android-partition-tools_prebuilt_binaries/releases/download/v1.0/lpunpack-arm64-v8a -O lpunpack || \
          wget -q https://raw.githubusercontent.com/HemanthJabalpuri/AndroidExplorer/master/lpunpack.py -O lpunpack.py
          chmod +x *
          echo "$HOME/bin" >> $GITHUB_PATH
      
      - name: Clone Phoenix
        run: |
          git clone --depth=1 https://github.com/DroidDumps/phoenix_firmware_dumper.git phoenix
          cd phoenix && chmod +x dumper.sh setup.sh
          bash setup.sh || true
      
      - name: Download firmware with aria2
        run: |
          mkdir -p firmware && cd firmware
          aria2c -x16 -s16 -c -o firmware.zip '${{ env.FIRMWARE_URL }}'
          ls -lh firmware.zip
          file firmware.zip
          echo "firmware_path=$(pwd)/firmware.zip" >> $GITHUB_ENV
      
      - name: Extract firmware and fix super.img
        run: |
          mkdir -p output && cd output
          unzip -q '${{ env.firmware_path }}'
          
          echo "Extracted files:"
          ls -lah
          
          # Find and process super.img
          SUPER_IMG=$(find . -name "super.img" -type f | head -1)
          
          if [ -n "$SUPER_IMG" ]; then
            echo "Found super.img: $SUPER_IMG"
            
            # Convert sparse to raw if needed
            if file "$SUPER_IMG" | grep -q "sparse"; then
              echo "Converting sparse super.img to raw..."
              simg2img "$SUPER_IMG" super.raw.img
              mv super.raw.img "$SUPER_IMG"
              echo "Converted successfully"
            fi
            
            # Extract partitions from super using lpunpack
            echo "Extracting partitions from super.img..."
            mkdir -p super_partitions
            cd super_partitions
            
            if command -v lpunpack &> /dev/null; then
              lpunpack "../$SUPER_IMG" .
            elif [ -f ~/bin/lpunpack.py ]; then
              python3 ~/bin/lpunpack.py "../$SUPER_IMG" .
            else
              echo "lpunpack not available, trying 7z..."
              7z x "../$SUPER_IMG" || true
            fi
            
            echo "Extracted partitions:"
            ls -lah
            
            # Mount and extract build.prop from each partition
            for img in *.img; do
              if [ -f "$img" ] && [ -s "$img" ]; then
                mkdir -p "${img%.img}_mnt"
                sudo mount -o loop "$img" "${img%.img}_mnt" 2>/dev/null && {
                  echo "Mounted $img"
                  find "${img%.img}_mnt" -name "build.prop" -exec cp {} "../${img%.img}_build.prop" \; 2>/dev/null
                  sudo umount "${img%.img}_mnt" 2>/dev/null || true
                }
                rmdir "${img%.img}_mnt" 2>/dev/null || sudo umount -l "${img%.img}_mnt" 2>/dev/null || true
              fi
            done
            
            cd ..
          else
            echo "No super.img found"
          fi
          
          # Copy extracted partitions back to main output
          cp -r super_partitions/*.img . 2>/dev/null || true
      
      - name: Run Phoenix dumper
        id: dump
        run: |
          cd phoenix
          mkdir -p working
          cp -r ../output/* working/ 2>/dev/null || true
          
          bash dumper.sh working/ 2>&1 | tee dump.log || true
          
          OUTPUT_DIR=$(find out -maxdepth 1 -type d | grep -v "^out$" | head -1)
          [ -z "$OUTPUT_DIR" ] && OUTPUT_DIR="out/tmp"
          [ -d "$OUTPUT_DIR" ] || OUTPUT_DIR="../output"
          
          echo "output_dir=$(realpath $OUTPUT_DIR 2>/dev/null || echo $OUTPUT_DIR)" >> $GITHUB_OUTPUT
          echo "total_size=$(du -sh $OUTPUT_DIR 2>/dev/null | cut -f1 || echo 'unknown')" >> $GITHUB_OUTPUT
      
      - name: Create archive
        id: archive
        run: |
          OUTPUT_DIR="${{ steps.dump.outputs.output_dir }}"
          ARCHIVE="${{ env.BRAND }}_${{ env.DEVICE_CODENAME }}_${{ env.FIRMWARE_VERSION }}_dump.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname $OUTPUT_DIR)" "$(basename $OUTPUT_DIR)"
          echo "archive_name=$ARCHIVE" >> $GITHUB_OUTPUT
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BRAND }}-${{ env.DEVICE_CODENAME }}-dump
          path: ${{ steps.archive.outputs.archive_name }}
          retention-days: 30
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.BRAND }}-${{ env.DEVICE_CODENAME }}-${{ env.FIRMWARE_VERSION }}-${{ github.run_number }}
          name: "${{ env.BRAND }} ${{ env.DEVICE_CODENAME }} - ${{ env.FIRMWARE_VERSION }}"
          body: |
            **Device:** ${{ env.BRAND }} ${{ env.DEVICE_CODENAME }}
            **Version:** ${{ env.FIRMWARE_VERSION }}
            **Size:** ${{ steps.dump.outputs.total_size }}
            **Source:** ${{ env.FIRMWARE_URL }}
            
            **Note:** Super.img manually extracted with simg2img + lpunpack
          files: ${{ steps.archive.outputs.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
