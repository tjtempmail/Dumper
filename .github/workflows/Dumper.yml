name: Phoenix Firmware Dumper & Repo Creator

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware file'
        required: true
        default: 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip'
      device_codename:
        description: 'Device codename (e.g., X659B)'
        required: true
        default: 'X659B'
      brand:
        description: 'Device brand'
        required: true
        default: 'Infinix'
      firmware_version:
        description: 'Firmware version/tag'
        required: true
        default: 'Hot-10i-04'
      repo_visibility:
        description: 'Repository visibility'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - private

env:
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url }}
  DEVICE_CODENAME: ${{ github.event.inputs.device_codename }}
  BRAND: ${{ github.event.inputs.brand }}
  FIRMWARE_VERSION: ${{ github.event.inputs.firmware_version }}
  REPO_VISIBILITY: ${{ github.event.inputs.repo_visibility }}

jobs:
  dump-and-create-repo:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            aria2 unzip p7zip-full \
            simg2img e2fsprogs \
            liblz4-tool brotli \
            git curl file zstd gh
      
      - name: Setup GitHub CLI authentication
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh auth status
      
      - name: Download lpunpack tool
        run: |
          mkdir -p ~/bin
          cd ~/bin
          
          echo "Downloading lpunpack..."
          wget -q https://github.com/northumber/android-partition-tools_prebuilt_binaries/releases/download/v1.0/lpunpack-arm64-v8a -O lpunpack 2>/dev/null || \
          wget -q https://raw.githubusercontent.com/HemanthJabalpuri/AndroidExplorer/master/lpunpack.py -O lpunpack.py 2>/dev/null || \
          (git clone --depth=1 https://android.googlesource.com/platform/system/extras lpunpack_src 2>/dev/null && \
           cd lpunpack_src/partition_tools && gcc -o lpunpack lpunpack.c 2>/dev/null) || \
          echo "WARNING: Could not download lpunpack, will use alternative methods"
          
          chmod +x * 2>/dev/null || true
          echo "$HOME/bin" >> $GITHUB_PATH
        continue-on-error: true
      
      - name: Clone Phoenix
        run: |
          git clone --depth=1 https://github.com/DroidDumps/phoenix_firmware_dumper.git phoenix
          cd phoenix && chmod +x dumper.sh setup.sh
          bash setup.sh || true
      
      - name: Download firmware with aria2
        run: |
          mkdir -p firmware && cd firmware
          echo "Downloading firmware..."
          aria2c -x16 -s16 -c -o firmware.zip '${{ env.FIRMWARE_URL }}'
          
          ls -lh firmware.zip
          file firmware.zip
          
          if ! unzip -t firmware.zip 2>&1 | head -5; then
            echo "WARNING: ZIP test failed, file may be corrupted"
          fi
          
          echo "firmware_path=$(pwd)/firmware.zip" >> $GITHUB_ENV
      
      - name: Extract firmware and process super.img
        run: |
          mkdir -p output && cd output
          unzip -q '${{ env.firmware_path }}'
          
          echo "Extracted files:"
          ls -lah
          
          SUPER_IMG=$(find . -name "super.img" -type f | head -1)
          
          if [ -n "$SUPER_IMG" ]; then
            echo "Found super.img: $SUPER_IMG"
            
            if file "$SUPER_IMG" | grep -q "sparse"; then
              echo "Converting sparse super.img..."
              simg2img "$SUPER_IMG" super.raw.img
              mv super.raw.img "$SUPER_IMG"
            fi
            
            mkdir -p super_partitions
            cd super_partitions
            
            if command -v lpunpack &> /dev/null; then
              echo "Using lpunpack..."
              lpunpack "../$SUPER_IMG" . || echo "lpunpack failed"
            elif [ -f ~/bin/lpunpack.py ]; then
              echo "Using lpunpack.py..."
              python3 ~/bin/lpunpack.py "../$SUPER_IMG" . || echo "lpunpack.py failed"
            else
              echo "No lpunpack available, trying 7z..."
              7z x "../$SUPER_IMG" || echo "7z extraction failed"
            fi
            
            echo "Partitions found:"
            ls -lah
            
            for img in *.img; do
              if [ -f "$img" ]; then
                mkdir -p mnt_tmp
                sudo mount -o loop "$img" mnt_tmp 2>/dev/null && {
                  find mnt_tmp -name "build.prop" -exec cp {} "../${img%.img}_build.prop" \; 2>/dev/null
                  sudo umount mnt_tmp 2>/dev/null || true
                }
                rmdir mnt_tmp 2>/dev/null || true
              fi
            done
            
            cd ..
          fi
          
          cp super_partitions/*.img . 2>/dev/null || true
      
      - name: Run Phoenix dumper
        id: dump
        run: |
          cd phoenix
          mkdir -p working
          cp -r ../output/* working/ 2>/dev/null || true
          
          bash dumper.sh working/ 2>&1 | tee dump.log || echo "Dumper finished with warnings"
          
          OUTPUT_DIR=$(find out -maxdepth 1 -type d | grep -v "^out$" | head -1)
          [ -z "$OUTPUT_DIR" ] && OUTPUT_DIR="out/tmp"
          
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR 2>/dev/null)" ]; then
            echo "Phoenix output empty, using manual extraction"
            OUTPUT_DIR="../output"
          fi
          
          echo "output_dir=$(realpath $OUTPUT_DIR 2>/dev/null || echo $OUTPUT_DIR)" >> $GITHUB_OUTPUT
          echo "total_size=$(du -sh $OUTPUT_DIR 2>/dev/null | cut -f1 || echo 'unknown')" >> $GITHUB_OUTPUT
          
          echo "Final output contents:"
          ls -la "$OUTPUT_DIR" || true
      
      - name: Generate repository name
        id: repo_name
        run: |
          # Sanitize names for valid GitHub repo names
          REPO_NAME=$(echo "${{ env.BRAND }}-${{ env.DEVICE_CODENAME }}-${{ env.FIRMWARE_VERSION }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-._' | cut -c1-100)
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "Repository name will be: $REPO_NAME"
      
      - name: Create new GitHub repository
        id: create_repo
        run: |
          REPO_NAME="${{ steps.repo_name.outputs.repo_name }}"
          VISIBILITY="${{ env.REPO_VISIBILITY }}"
          
          echo "Creating repository: $REPO_NAME (visibility: $VISIBILITY)"
          
          # Check if repo already exists
          if gh repo view "${{ github.repository_owner }}/$REPO_NAME" &>/dev/null; then
            echo "Repository already exists, will push to existing repo"
            echo "repo_url=https://github.com/${{ github.repository_owner }}/$REPO_NAME" >> $GITHUB_OUTPUT
            echo "repo_exists=true" >> $GITHUB_OUTPUT
          else
            # Create new repository using gh cli [^14^][^16^]
            gh repo create "$REPO_NAME" \
              --$VISIBILITY \
              --description "${{ env.BRAND }} ${{ env.DEVICE_CODENAME }} firmware dump - ${{ env.FIRMWARE_VERSION }}" \
              --enable-issues=true \
              --enable-wiki=false
            
            echo "repo_url=https://github.com/${{ github.repository_owner }}/$REPO_NAME" >> $GITHUB_OUTPUT
            echo "repo_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare repository content
        run: |
          OUTPUT_DIR="${{ steps.dump.outputs.output_dir }}"
          REPO_NAME="${{ steps.repo_name.outputs.repo_name }}"
          
          # Create a clean directory for the new repo
          mkdir -p new_repo_content
          cd new_repo_content
          
          # Copy all dump files
          cp -r "$OUTPUT_DIR"/* . 2>/dev/null || true
          
          # Create README.md
          cat > README.md << 'EOF'
          # ${{ env.BRAND }} ${{ env.DEVICE_CODENAME }} - ${{ env.FIRMWARE_VERSION }}
          
          **Firmware Dump Details:**
          | Property | Value |
          |----------|-------|
          | **Brand** | ${{ env.BRAND }} |
          | **Device** | ${{ env.DEVICE_CODENAME }} |
          | **Version** | ${{ env.FIRMWARE_VERSION }} |
          | **Source** | ${{ env.FIRMWARE_URL }} |
          | **Dump Size** | ${{ steps.dump.outputs.total_size }} |
          | **Dump Date** | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |
          | **Workflow Run** | ${{ github.run_id }} |
          
          ## Contents
          - Partition images (`.img` files)
          - Build.prop extracts
          - Firmware metadata
          
          ## Verification
          Generated by [Phoenix Firmware Dumper](https://github.com/DroidDumps/phoenix_firmware_dumper)
          EOF
          
          # Create .gitattributes for large files
          cat > .gitattributes << 'EOF'
          *.img filter=lfs diff=lfs merge=lfs -text
          *.zip filter=lfs diff=lfs merge=lfs -text
          *.tar.gz filter=lfs diff=lfs merge=lfs -text
          *.raw filter=lfs diff=lfs merge=lfs -text
          EOF
          
          # Create metadata file
          cat > firmware-info.json << EOF
          {
            "brand": "${{ env.BRAND }}",
            "device": "${{ env.DEVICE_CODENAME }}",
            "version": "${{ env.FIRMWARE_VERSION }}",
            "source_url": "${{ env.FIRMWARE_URL }}",
            "dump_size": "${{ steps.dump.outputs.total_size }}",
            "dump_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run": "${{ github.run_id }}",
            "repository": "${{ github.repository }}"
          }
          EOF
      
      - name: Initialize and push to new repository
        run: |
          REPO_NAME="${{ steps.repo_name.outputs.repo_name }}"
          REPO_URL="${{ steps.create_repo.outputs.repo_url }}"
          OUTPUT_DIR="${{ steps.dump.outputs.output_dir }}"
          
          cd new_repo_content
          
          # Initialize git repo
          git init
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Add remote with PAT for authentication [^17^]
          git remote add origin "https://${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/$REPO_NAME.git"
          
          # Setup Git LFS for large files (optional but recommended)
          git lfs track "*.img" 2>/dev/null || true
          git lfs track "*.zip" 2>/dev/null || true
          
          # Add all files
          git add .
          
          # Commit
          git commit -m "Initial firmware dump: ${{ env.BRAND }} ${{ env.DEVICE_CODENAME }} ${{ env.FIRMWARE_VERSION }}
          
          Source: ${{ env.FIRMWARE_URL }}
          Size: ${{ steps.dump.outputs.total_size }}
          Workflow: ${{ github.run_id }}"
          
          # Push to main branch
          git branch -M main
          git push -u origin main --force
      
      - name: Create summary comment
        run: |
          echo "## ✅ Firmware Dump Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository Created:** ${{ steps.create_repo.outputs.repo_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Brand** | ${{ env.BRAND }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Device** | ${{ env.DEVICE_CODENAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ env.FIRMWARE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Size** | ${{ steps.dump.outputs.total_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visibility** | ${{ env.REPO_VISIBILITY }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Repository](${{ steps.create_repo.outputs.repo_url }})" >> $GITHUB_STEP_SUMMARY
          
